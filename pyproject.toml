[project]
name = "docStructure"
version = "1.0"
description = "This project breaks down any html-compatible document (which is everything, really) into sentences, words, parts of speech, etc"

[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = "."

